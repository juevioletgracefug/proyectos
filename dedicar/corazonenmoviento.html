<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corazón de palabras</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: sans-serif;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .controls label { font-size: 13px; color: #aaa; }
    .controls input[type=text] {
      width: 160px;
      font-size: 15px;
      text-align: center;
      padding: 5px 10px;
      border: 1px solid #555;
      border-radius: 8px;
      background: #1a1a1a;
      color: #fff;
      outline: none;
      letter-spacing: 2px;
    }
    .controls input[type=text]:focus { border-color: #E24B4A; }
    .controls input[type=color] {
      width: 36px; height: 36px;
      border: none; background: none;
      cursor: pointer; padding: 0;
    }
    canvas { display: block; }
  </style>
</head>
<body>

  <div class="controls">
    <label>Texto:</label>
    <input type="text" id="inp" maxlength="20" value="I love you" />
    <label>Color:</label>
    <input type="color" id="colorPick" value="#ff4466" />
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const inp = document.getElementById('inp');
    const colorPick = document.getElementById('colorPick');

    canvas.width  = Math.min(window.innerWidth, 700);
    canvas.height = Math.min(window.innerHeight - 80, 520);

    let words = [];
    let baseColor = '#ff4466';

    function heartX(t) { return 16 * Math.pow(Math.sin(t), 3); }
    function heartY(t) { return -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t)); }

    function hexToRgb(hex) {
      return {
        r: parseInt(hex.slice(1,3), 16),
        g: parseInt(hex.slice(3,5), 16),
        b: parseInt(hex.slice(5,7), 16)
      };
    }

    function buildWords() {
      words = [];
      const text  = inp.value || 'I love you';
      const cx    = canvas.width / 2;
      const cy    = canvas.height / 2 - 10;
      const scale = Math.min(canvas.width, canvas.height) / 38;

      // Capa exterior
      for (let i = 0; i < 180; i++) {
        const t = (i / 180) * 2 * Math.PI;
        words.push({
          x:         heartX(t) * scale + cx,
          y:         heartY(t) * scale + cy,
          text:      text,
          delay:     Math.random() * 3000,
          dur:       1800 + Math.random() * 1200,
          fontSize:  9 + Math.random() * 7,
          baseAlpha: 0.5 + Math.random() * 0.5,
          phase:     Math.random() * Math.PI * 2
        });
      }
      // Capa interior
      for (let j = 0; j < 90; j++) {
        const t = (j / 90) * 2 * Math.PI;
        words.push({
          x:         heartX(t) * scale * 0.6 + cx,
          y:         heartY(t) * scale * 0.6 + cy,
          text:      text,
          delay:     Math.random() * 3000,
          dur:       1800 + Math.random() * 1200,
          fontSize:  7 + Math.random() * 5,
          baseAlpha: 0.3 + Math.random() * 0.4,
          phase:     Math.random() * Math.PI * 2
        });
      }
    }

    const startTime = performance.now();

    function draw(now) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const elapsed = now - startTime;
      const rgb = hexToRgb(baseColor);

      for (const w of words) {
        const t = elapsed - w.delay;
        if (t < 0) continue;

        const cycle = (t % w.dur) / w.dur;
        let alpha;
        if      (cycle < 0.15) alpha = (cycle / 0.15) * w.baseAlpha;
        else if (cycle < 0.70) alpha = w.baseAlpha;
        else                   alpha = ((1 - cycle) / 0.3) * w.baseAlpha;

        const pulse = 0.85 + 0.15 * Math.sin(elapsed * 0.002 + w.phase);
        const glow  = Math.sin(elapsed * 0.003 + w.phase) * 0.5 + 0.5;
        alpha *= pulse;

        ctx.save();
        ctx.globalAlpha  = Math.min(1, alpha);
        ctx.font         = w.fontSize + 'px Arial, sans-serif';
        ctx.shadowColor  = `rgba(${rgb.r},${rgb.g},${rgb.b},${0.6 * glow})`;
        ctx.shadowBlur   = 8 * glow;
        ctx.fillStyle    = `rgb(${rgb.r},${rgb.g},${rgb.b})`;
        ctx.fillText(w.text, w.x - ctx.measureText(w.text).width / 2, w.y);
        ctx.restore();
      }

      requestAnimationFrame(draw);
    }

    buildWords();
    requestAnimationFrame(draw);

    inp.addEventListener('input', buildWords);
    colorPick.addEventListener('input', function() { baseColor = this.value; });

    window.addEventListener('resize', () => {
      canvas.width  = Math.min(window.innerWidth, 700);
      canvas.height = Math.min(window.innerHeight - 80, 520);
      buildWords();
    });
  </script>
</body>
</html>
